repos:
  # ── ruff: fast lint + format (replaces flake8 + isort + black) ────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ── mypy: static type checking ────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.7
          - pydantic-settings>=2.3
          - numpy>=1.26
          - pandas>=2.2
          - h5py>=3.11
          - types-tqdm

  # ── nbstripout: strip notebook outputs before committing ─────────────────
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout

  # ── bandit: Python security linter ────────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.0
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -r, src/]
        additional_dependencies: ["bandit[toml]"]

  # ── checkov: IaC & config security scanner ──────────────────────────────
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.2.346
    hooks:
      - id: checkov
        # CKV_DOCKER_2: no HEALTHCHECK — acceptable for batch job containers
        # CKV_DOCKER_3: USER not root — already handled (node user)
        # CKV_DOCKER_7: no arbitrary user IDs — not applicable to dev/batch containers
        args: [--skip-check, CKV_DOCKER_2,CKV_DOCKER_3,CKV_DOCKER_7]

  # ── detect-secrets: prevent committing secrets/credentials ───────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]

  # ── Standard pre-commit hooks ─────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
