[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hm2p"
version = "0.1.0"
description = "Cloud pipeline for hm2p two-photon calcium imaging in freely-moving mice (RSP, Penk+/CamKII+ populations)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Tristan" }]

# ---------------------------------------------------------------------------
# Core runtime dependencies — grouped by pipeline stage
# ---------------------------------------------------------------------------
dependencies = [
    # Configuration & session registry
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    # Stage 0 — DAQ / ingest
    "nptdms>=1.9",
    "h5py>=3.11",
    # Stage 3 — Kinematics
    # movement 0.17 (per-format loaders, singular dims) requires Python >=3.12.
    "movement>=0.17,<0.18",
    "shapely>=2.0,<3.0",
    "scipy>=1.13,<2.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "xarray>=2024.6",
    "bottleneck>=1.3,<2.0",  # required by xarray for ffill/bfill in interpolation
    # Stage 4 — Calcium processing
    # NOTE: cascade2p is NOT on PyPI; install separately — see [project.optional-dependencies]
    "roiextractors>=0.5.10,<1.0",
    # scikit-learn powers the soma/dend/artefact classifier. joblib persists
    # the fitted pipeline. xgboost is the champion ROI classifier. scikit-image
    # provides skeletonize for mask topology features (branch points).
    "scikit-learn>=1.4,<2.0",
    "joblib>=1.3,<2.0",
    "xgboost>=2.0,<4.0",
    "scikit-image>=0.22,<1.0",
    # Stage 5 — Sync
    # (numpy + scipy + pandas already listed above)
    # IO & validation
    "pandera>=0.20,<1.0",
    "pynapple>=0.6,<1.0",
    # IO — AWS
    "boto3>=1.34,<2.0",
    # Logging
    "structlog>=24.1,<26.0",
    # Utilities
    "tqdm>=4.66,<5.0",
    "rich>=13.7,<14.0",
    "typer>=0.12,<1.0",
    "cellpose>=4.0.9",
]

[project.optional-dependencies]
# ---------------------------------------------------------------------------
# Optional — heavy GPU / extraction backends (install in appropriate env)
# ---------------------------------------------------------------------------
suite2p = [
    "suite2p>=0.14",
]
# caiman — NOT listed as an optional dep because the real CaImAn (Flatiron)
# is only on conda-forge, not PyPI (PyPI "caiman" is an unrelated v0.1 package).
# Install via: conda install -c conda-forge caiman
dlc = [
    # DLC 3.0 has only pre-release RCs on PyPI; use 2.3.x stable for now.
    # When 3.0 stable lands, bump to deeplabcut[tf]>=3.0.
    "deeplabcut>=2.3",
]
sleap = [
    "sleap>=1.4",
]
# ---------------------------------------------------------------------------
# Packages below are NOT managed by uv — install manually in separate envs.
# They have incompatible transitive pins (numpy, scikit-learn, tensorflow)
# that break universal resolution. See docs/manual-installs.md.
#
#   fissa>=1.0           — pins scikit-learn<1.2
#   cascade2p            — pins tensorflow==2.3 (Python 3.8 only)
#   caiman (conda-forge) — not on PyPI
#   keypoint-moseq>=0.6  — pins numpy<=1.26
#   vame-py>=0.12        — requires numpy>=2.2
#   cebra>=0.6           — pins numpy<2.0
# ---------------------------------------------------------------------------
nwb = [
    "neuroconv>=0.6",
    "pynwb>=2.7",
]
analysis = [
    "nemos>=0.1",
    "duckdb>=1.0",       # analysis result cache (hm2p.analysis.cache)
    "rastermap>=0.9",    # population raster ordering (hm2p.analysis.rastermap_analysis)
    "statsmodels>=0.14",  # LMM/ICC supplementary stats (hm2p.analysis.mixed_stats)
]
workflow = [
    "snakemake>=8.0",
    "snakemake-executor-plugin-aws-batch>=0.2",
]
# Streamlit dashboard + Plotly figures (frontend/ and hm2p.patching.plotting).
# Required for the frontend and its tests, and for the patching plotting tests.
frontend = [
    "streamlit>=1.40",
    "plotly>=5.20",
]

# ---------------------------------------------------------------------------
# Dev dependencies
# ---------------------------------------------------------------------------
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.108",
    "ruff>=0.5",
    "mypy>=1.11",
    "bandit[toml]>=1.8",
    "detect-secrets>=1.5",
    "pip-audit>=2.7",
    "vulture>=2.14",
    "pre-commit>=3.8",
    "nbstripout>=0.7",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.scripts]
hm2p = "hm2p.cli:app"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

# --- uv --------------------------------------------------------------------
[tool.uv]
# Only resolve for Linux/macOS — this project never runs on Windows.
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]
# movement depends on xarray[accel, io, viz]; the viz extra pulls in cartopy
# which needs C libs (libgeos, libproj) we don't need. Override to plain xarray.
override-dependencies = [
    "xarray>=2024.6",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/hm2p"]

# --- ruff -------------------------------------------------------------------
[tool.ruff]
src = ["src"]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
# pep8-naming (N) and flake8-annotations (ANN) are intentionally not enforced:
# the codebase uses domain naming conventions (Suite2p F/Fneu, single-capital
# array dims, MVL/HD/AHV) and does not require type annotations on every
# function. High-value correctness rules (pyflakes, bugbear) stay on.
ignore = [
    "ANN401",  # dynamically typed expressions (Any) — needed for HDF5 attr values
    "SIM108",  # ternary suggestions — explicit if/else more readable for scientific code
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
# F, F0, Fneu are conventional Suite2p / neuroscience variable names —
# suppressing pep8-naming for calcium source + tests + dependent modules.
# T is conventional for number of timepoints in neuroscience.
"src/hm2p/calcium/**"     = ["N803", "N806"]
"src/hm2p/extraction/**"  = ["N803", "N806"]
"tests/calcium/**"        = ["N803", "N806"]
"tests/extraction/**"     = ["N803", "N806"]
"tests/sync/**"           = ["N806"]
"tests/test_cli.py"       = ["N806"]
"src/hm2p/io/hdf5.py"    = ["N806"]
"tests/io/test_hdf5.py"  = ["N803", "N806"]
# scripts/ — Suite2p variable names + script CLIs are exempt from
# strict typing / naming enforcement; they're runnable entry points.
"scripts/**"              = ["N803", "N806", "ANN"]
# EC2 launchers embed verbatim bash user-data heredocs (aws cli + python
# one-liners) that exceed the 99-char limit; wrapping them would corrupt the
# embedded shell script.
"scripts/launch_*_ec2.py" = ["E501"]
# test scripts import from scripts/ after a sys.path.insert (E402) and embed
# verbatim long fixtures (E501).
"tests/scripts/**"        = ["N803", "N806", "E402"]
"tests/scripts/test_stage3_helpers.py" = ["E402", "E501"]
# imports pytest.importorskip'd optional deps before other imports.
"tests/kinematics/test_syllables.py" = ["E402"]
# frontend/ pages have a sys.path.insert before imports (legacy convention)
# and embed verbatim methodology markdown that exceeds the 99-char limit.
"frontend/pages/**"       = ["E402", "E501"]
"frontend/components/**"  = ["E402"]
"tests/frontend/**"       = ["E402"]

[tool.ruff.format]
quote-style = "double"

# --- vulture (dead-code detector) -------------------------------------------
[tool.vulture]
# Unused parameters retained for API/signature stability in deferred stages
# (VAME syllables, NWB export) — not dead code, kept for the planned callers.
ignore_names = ["sync_h5", "pose_datasets", "session_ids"]

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
# Non-strict: this is scientific code built on numpy/pandas/h5py whose dynamic
# typing makes full strict mode (disallow_any_generics, warn_return_any,
# disallow_untyped_defs) produce mostly noise. Keep mypy's default checks,
# which still catch genuine type errors (bad attributes, arg types, indexing).
ignore_missing_imports = true
warn_unused_configs = true
# import-untyped only asks to install third-party stub packages (e.g.
# types-PyYAML); not worth maintaining as a hard CI gate here.
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["movement.*", "roiextractors.*", "cascade2p.*", "nptdms.*", "pandera.*"]
ignore_missing_imports = true

# --- bandit (security linter) -----------------------------------------------
[tool.bandit]
targets = ["src/"]
exclude_dirs = ["tests/", "old-pipeline/"]
skips = [
    "B101",  # assert — used heavily in tests and validation
    "B404",  # import subprocess — needed for kpms/docker orchestration
    "B603",  # subprocess without shell=True — our use is safe (no user input)
    "B105",  # "hardcoded password" false positives on QC dicts keyed "pass"
]

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is enabled explicitly by the CI test step (--cov=hm2p
# --cov-fail-under=90), not here: keeping --cov in the default addopts makes
# every ad-hoc or filtered run (e.g. pytest -k ...) trip the fail_under gate.
addopts = ""
markers = [
    "golden: regression tests against three real sessions on S3 — not run in CI",
]

[tool.coverage.run]
source = ["src/hm2p"]
branch = true

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
