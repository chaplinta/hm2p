# hm2p pipeline configuration.
#
# Defaults for the Snakemake workflow. Every key here is also read with a
# fallback in the rules (config.get(...)), so this file documents the tunable
# parameters and their defaults. Paths (data_root, metadata_dir) are normally
# supplied on the command line via --config for a given run/environment.

# Root of the NeuroBlueprint data tree (rawdata/, sourcedata/, derivatives/).
data_root: "data"

# Calcium processing (Stage 4)
neuropil_coefficient: 0.7
dff_baseline_window_s: 60.0
run_cascade: false
cascade_model: "Global_EXC_7.5Hz_smoothing200ms"
suite2p_ops: {}

# AWS Batch container image prefix (empty = local execution).
ecr_prefix: ""
