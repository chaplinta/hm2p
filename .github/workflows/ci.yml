name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run nightly at 03:00 UTC (11:00 AWST)
    - cron: "0 3 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run tests with coverage
        run: |
          uv run pytest --cov=hm2p --cov-report=xml --cov-fail-under=90

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  snakemake-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen --extra workflow

      - name: Create mock data directories
        run: |
          # Create a minimal mock session so Snakemake can resolve the DAG.
          # Uses a temp directory — never clobbers real metadata/.
          SESSION="20221115_13_27_42_1118213"
          SUB="sub-1118213"
          SES="ses-20221115T132742"
          DATA=$(mktemp -d)

          # Create minimal metadata in temp dir
          mkdir -p "$DATA/metadata"
          echo "animal_id,celltype,gcamp,virus_id" > "$DATA/metadata/animals.csv"
          echo "1118213,penk,7f,ADD3" >> "$DATA/metadata/animals.csv"
          echo "exp_id,orientation,bad_behav_times" > "$DATA/metadata/experiments.csv"
          echo "$SESSION,0.0," >> "$DATA/metadata/experiments.csv"

          # Create mock rawdata directories with placeholder files
          mkdir -p "$DATA/rawdata/$SUB/$SES/funcimg"
          mkdir -p "$DATA/rawdata/$SUB/$SES/behav"
          touch "$DATA/rawdata/$SUB/$SES/funcimg/${SESSION}-di.tdms"
          touch "$DATA/rawdata/$SUB/$SES/funcimg/${SESSION}_XYT.tif"
          touch "$DATA/rawdata/$SUB/$SES/funcimg/${SESSION}.meta.txt"
          touch "$DATA/rawdata/$SUB/$SES/behav/${SESSION}-cropped.mp4"
          touch "$DATA/rawdata/$SUB/$SES/behav/${SESSION}.meta.txt"

          # Create mock sourcedata
          mkdir -p "$DATA/sourcedata/trackers/dlc"
          touch "$DATA/sourcedata/trackers/dlc/config.yaml"

          echo "MOCK_DATA_DIR=$DATA" >> "$GITHUB_ENV"

      - name: Snakemake dry-run
        run: |
          cd workflow && uv run snakemake -n --profile profiles/local \
            --config data_root="$MOCK_DATA_DIR" metadata_dir="$MOCK_DATA_DIR/metadata"
