name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run ruff (lint)
        run: uv run ruff check src/ tests/

      - name: Run ruff (format check)
        run: uv run ruff format --check src/ tests/

      - name: Run mypy
        run: uv run mypy src/

      - name: Run bandit (security)
        run: uv run bandit -c pyproject.toml -r src/

      - name: Run checkov (IaC security)
        run: |
          uv run checkov -d . \
            --framework dockerfile \
            --skip-check CKV_DOCKER_2,CKV_DOCKER_3,CKV_DOCKER_7 \
            --quiet

      - name: Run pip-audit (dependency CVEs)
        run: uv run pip-audit --strict --desc

      - name: Run vulture (dead code)
        run: uv run vulture src/ --min-confidence 90

      - name: Run detect-secrets
        run: uv run detect-secrets scan --baseline .secrets.baseline

      - name: Run pandera schema validation (via tests)
        run: uv run pytest tests/ -k "pandera or schema or validate" --no-header -q
